name: Godot Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "godot/**"
      - ".github/workflows/godot-android.yml"

jobs:
  export:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools, platforms;android-34, build-tools;34.0.0'
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.3.0
          use-dotnet: false
      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          curl -fL https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/* ~/.local/share/godot/export_templates/4.3.stable/
      - name: Configure Android SDK
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
      - name: Import project and export APK
        run: |
          mkdir -p godot/build
          godot --headless --path godot --editor --import
          godot --headless --path godot --export-debug "Android" build/MarkII-Drift.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MarkII-Drift-APK
          path: godot/build/MarkII-Drift.apk
          if-no-files-found: error
